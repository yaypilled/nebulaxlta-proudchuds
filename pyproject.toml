[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulax-ps3"
version = "0.1.0"
description = "NebulaX LTA 2026 Problem Statement 3 — Rail Corrugation"
requires-python = ">=3.13"

[tool.setuptools]
packages = ["src", "src.common", "src.rail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `from src.common...` resolves when pytest is
# run from the root without an editable install.
pythonpath = ["."]
